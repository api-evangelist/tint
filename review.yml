aid: tint
name: Tint
review:
  question: Does Tint (tint.ai) expose a real, documented public REST API for embedded insurance?
  answer: true
  date: '2026-06-25'
  reviewer: API Evangelist
  availabilityNote: |
    Tint publishes a real, documented REST API (Tint API v2) at
    https://docs.tint.ai with a stable base URL https://api.tint.ai/v2 and
    Bearer-token authentication. However, the API is not self-service: there
    is no public sign-up, no published pricing, and access (including sandbox
    credentials) is arranged through Tint as part of a sales-led, per-program
    engagement. The documentation is openly readable; production use is
    partner-gated.
disambiguation:
  summary: |
    "Tint" is an overloaded name across software and consumer brands. This
    catalog entry is specifically about Tint, the embedded protection /
    insurance-as-a-service infrastructure company at https://www.tint.ai
    (YC W21, founded 2018 by Matheus Riolfi and Jerome Selles, San Francisco;
    proprietary platform branded "Hermes"). It is NOT any of the similarly
    named, unrelated products below.
  notThisProvider:
  - name: Tint (Sanity / structured content "Tint")
    note: Unrelated; social content and UGC display tooling formerly branded Tint.
  - name: TINT by Filestack / social UGC platform
    note: A separate user-generated-content marketing product.
  - name: Tint color / theming libraries and CSS tools
    note: Generic developer utilities that share the word "tint".
  - name: Window tint / automotive and consumer tint brands
    note: Physical products unrelated to software or insurance.
findings:
  summary: |
    Tint (tint.ai) operates Hermes, an AI-native insurance operating system,
    and exposes the same capabilities to platform partners through the Tint
    API v2. The API is REST over HTTPS at https://api.tint.ai/v2, authenticated
    with "Authorization: Bearer ${API_TOKEN}" and "Content-Type: application/json".
    Sandbox vs production is selected by the token rather than by a separate
    base URL. Documented surfaces cover insurance products (programs) and
    plans, rated quotes (with coverages returned inline), the full policy
    lifecycle and endorsements, claims handling from FNOL through settlement,
    Decision Engine decisions, Score Module scores, questionnaires, and a rich
    set of policy and claim webhook events. There is no dedicated
    customer/policyholder entity endpoint; policyholder and claimant data are
    passed inline within request bodies, and per-program request/response
    schemas are governed by Tint's configurable validation schema.
  transports:
  - protocol: REST
    scheme: https
    baseURL: https://api.tint.ai/v2
    documented: true
  - protocol: Webhooks
    scheme: https
    documented: true
    note: Outbound event notifications for policy and claim lifecycle events with retry/delivery assurance.
  auth:
    type: Bearer
    header: 'Authorization: Bearer ${API_TOKEN}'
    note: Same token determines sandbox vs production routing.
