  notes: |
    Programs are represented as Insurance Products; there is no separate
    "programs" endpoint name. Coverages are not a standalone REST resource -
    they are returned inline within quotes. No customer/policyholder entity
    endpoint exists. Rate Limits and Error Handling are documented sections
    of the integration guide, but specific numeric limits were not captured
    and are left unreconciled.
