actions:
  apisYmlCreated: true
  openapiCreated: true
  openapiPath: openapi/tint-openapi.yml
  reason: |
    A real, documented REST API exists, so an OpenAPI 3.0.1 document was
    authored from the publicly documented endpoint paths, base URL, and
    Bearer auth scheme. Per-program request/response schemas are governed by
    Tint's configurable validation schema and are not publicly enumerated, so
    operation bodies are intentionally left unmodeled rather than fabricated.
